<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>numr - Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://umami.beneric.studio/script.js" data-website-id="20c5159f-decb-4b96-9e87-37133a60698d"></script>
</head>
<body>
    <div class="container">
        <!-- Header with actions -->
        <header>
            <a href="/" class="logo"><img src="NUMR.svg" alt="NUMR"></a>
            <div class="actions">
                <button id="btn-rates" title="Refresh exchange rates"><i data-lucide="refresh-cw"></i></button>
                <button id="btn-new" title="New document"><i data-lucide="file-plus"></i></button>
                <button id="btn-save" title="Download file"><i data-lucide="download"></i></button>
                <button id="btn-load" title="Upload file"><i data-lucide="upload"></i></button>
                <input type="file" id="file-input" accept=".numr,.txt" hidden>
            </div>
        </header>

        <!-- Main editor area: single scroll container with 3-column grid -->
        <main class="scroll-wrapper">
            <div class="editor-grid">
                <div class="gutter" id="line-numbers"></div>
                <div class="editor" id="editor"></div>
                <div class="gutter" id="results"></div>
            </div>
        </main>

        <!-- Footer with totals -->
        <footer>
            <div id="totals"></div>
        </footer>
    </div>

    <script type="module" src="app.js?v=13348"></script>
</body>
</html>
