<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>numr - Text Calculator with Units, Currency & Variables</title>
    <meta
      name="description"
      content="Natural language calculator. Write expressions like '20% of 150', '$100 in euros', or '2h + 30min'. Variables, unit conversions, and live exchange rates."
    />
    <link rel="canonical" href="https://numr.cc" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://numr.cc" />
    <meta property="og:title" content="numr - Text Calculator" />
    <meta
      property="og:description"
      content="Natural language calculator with variables, units, and live currency rates."
    />
    <meta property="og:image" content="https://numr.cc/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Favicon & Theme -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico?v=adcd652552"
      sizes="any"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=a587dc9ec0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon.png?v=98913d2459"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=e10cd04d91" />
    <meta name="theme-color" content="#1a1a2e" />

    <link rel="stylesheet" href="style.css?v=a5d9234d9e" />

    <!-- Preload critical resources -->
    <link
      rel="preload"
      href="/pkg/core/numr_core_bg.wasm?v=17c3cb2f04"
      as="fetch"
      crossorigin
    />
    <link
      rel="preload"
      href="/pkg/editor/numr_editor_bg.wasm?v=17c3cb2f04"
      as="fetch"
      crossorigin
    />
    <script
      defer
      src="https://umami.beneric.studio/script.js"
      data-website-id="20c5159f-decb-4b96-9e87-37133a60698d"
      data-domains="numr.cc,www.numr.cc"
      data-exclude-hash="true"
      data-do-not-track="true"
    ></script>
  </head>
  <body>
    <div class="container">
      <!-- Header with actions -->
      <header>
        <a href="/" class="logo"
          ><img src="NUMR.svg?v=d65f1f804f" alt="NUMR"
        /></a>
        <div class="actions">
          <button id="btn-rates" title="Refresh exchange rates">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 1-15.74 6.74L3 16" />
              <path d="M3 21v-5h5" />
              <path d="M3 12A9 9 0 0 1 18.74 5.26L21 8" />
              <path d="M16 8h5V3" />
            </svg>
          </button>
          <button id="btn-share" title="Share document link">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3" />
              <circle cx="6" cy="12" r="3" />
              <circle cx="18" cy="19" r="3" />
              <path d="m8.59 13.51 6.83 3.98M15.41 6.51 8.59 10.49" />
            </svg>
          </button>
          <button id="btn-new" title="New document">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
              <polyline points="14 2 14 8 20 8" />
              <path d="M12 18v-6M9 15h6" />
            </svg>
          </button>
          <button id="btn-save" title="Download file">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" x2="12" y1="15" y2="3" />
            </svg>
          </button>
          <button id="btn-load" title="Upload file">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" x2="12" y1="3" y2="15" />
            </svg>
          </button>
          <input type="file" id="file-input" accept=".numr,.txt" hidden />
        </div>
      </header>

      <main class="editor" id="editor"></main>

      <!-- Footer with totals -->
      <footer>
        <div id="totals"></div>
      </footer>
    </div>

    <script type="module" src="app.js?v=a8ac2668c1"></script>
  </body>
</html>
