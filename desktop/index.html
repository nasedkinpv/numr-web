<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>numr</title>
    <meta name="theme-color" content="#1a1c1e" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="desktop.css" />
  </head>
  <body class="desktop">
    <div class="container">
      <header data-tauri-drag-region>
        <div class="logo" data-tauri-drag-region>
          <img src="numr-wordmark.svg" alt="numr" draggable="false" data-tauri-drag-region />
        </div>
        <span id="document-name" class="document-name untitled" data-tauri-drag-region>Untitled</span>
        <div class="actions">
          <button id="btn-share" title="Share document link" aria-label="Share document link">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3" />
              <circle cx="6" cy="12" r="3" />
              <circle cx="18" cy="19" r="3" />
              <path d="m8.59 13.51 6.83 3.98M15.41 6.51 8.59 10.49" />
            </svg>
          </button>
          <button id="btn-new" title="New document" aria-label="New document">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
              <polyline points="14 2 14 8 20 8" />
              <path d="M12 18v-6M9 15h6" />
            </svg>
          </button>
          <button id="btn-save" title="Download file" aria-label="Download file">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" x2="12" y1="15" y2="3" />
            </svg>
          </button>
          <button id="btn-hide" title="Hide numr" aria-label="Hide numr">
            <svg aria-hidden="true" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M3 3l6 6M9 3 3 9" />
            </svg>
          </button>
        </div>
      </header>

      <main class="editor" id="editor"></main>

      <footer>
        <div class="footer-actions">
          <button id="btn-settings" popovertarget="settings" title="Settings" aria-label="Settings">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button id="btn-rates" title="Refresh exchange rates" aria-label="Refresh exchange rates">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 1-15.74 6.74L3 16" />
              <path d="M3 21v-5h5" />
              <path d="M3 12A9 9 0 0 1 18.74 5.26L21 8" />
              <path d="M16 8h5V3" />
            </svg>
          </button>
          <div id="settings" popover>
            <div class="setting" role="group" aria-label="Theme">
              <span>Theme</span>
              <span class="segmented">
                <label><input type="radio" name="theme" value="system" checked />System</label>
                <label><input type="radio" name="theme" value="dark" />Dark</label>
                <label><input type="radio" name="theme" value="light" />Light</label>
              </span>
            </div>
            <label class="setting">
              <span>Line numbers</span>
              <input id="setting-line-numbers" type="checkbox" role="switch" />
            </label>
            <label class="setting">
              <span>Wrap lines</span>
              <input id="setting-wrap" type="checkbox" role="switch" />
            </label>
            <label class="setting">
              <span>Decimal places</span>
              <input id="decimal-places" type="number" min="0" max="28" step="1" inputmode="numeric" placeholder="Auto" title="Display precision; empty keeps each value's own formatting" />
            </label>
          </div>
        </div>
        <div id="totals"></div>
      </footer>
    </div>

    <script type="module" src="app.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
