server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types
    include /etc/nginx/mime.types;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    # Cache static assets + CORS for cross-origin imports
    location ~* \.(wasm|css|svg|d\.ts)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # Module imports are not guaranteed to inherit the entrypoint's version
    # query. Revalidate JavaScript so shared service fixes cannot stay stale.
    location ~* \.js$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # Always revalidate HTML so new asset version params propagate immediately
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # WASM MIME type
    location ~* \.wasm$ {
        types { application/wasm wasm; }
    }

    # Share links use URL fragments, so the server only needs real files.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
