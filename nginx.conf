server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types
    include /etc/nginx/mime.types;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/html
        text/plain;

    # Cache static assets
    location ~* \.(wasm|js|css|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WASM MIME type
    location ~* \.wasm$ {
        types { application/wasm wasm; }
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
